[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caspian"
version = "0.1.0"
description = "Waterline-derived seabed topography and bathymetry hindcast audit for the North Caspian Sea"
authors = [{ name = "Rezwan Ahmed", email = "rezwan.ahmed@du.ac.bd" }]
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
